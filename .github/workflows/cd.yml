name: CD - Build & Deploy Docker Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_run:
    workflows: ["CI - Test & Code Quality"]
    types: [completed]
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success')
    
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub (optional)
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      if: github.event_name == 'push' && secrets.DOCKER_USERNAME != ''

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: |
          ${{ secrets.DOCKER_USERNAME }}/sdlc-multi-agent
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: ${{ github.event_name == 'push' && secrets.DOCKER_USERNAME != '' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build Docker image locally
      if: github.event_name != 'push' || secrets.DOCKER_USERNAME == ''
      run: docker build -t sdlc-multi-agent:latest .

    - name: Test Docker image
      run: |
        docker build -t sdlc-multi-agent:test -f Dockerfile .
        echo "Docker image built successfully"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Deploy notification
      run: |
        echo "✅ Deployment pipeline triggered for main branch"
        echo "📦 Image ready for deployment to staging/production"
        echo "Next steps: Configure deployment webhook or manual deploy"

    - name: Generate deployment report
      run: |
        cat > deployment-report.md << EOF
        # Deployment Report
        - **Branch**: ${{ github.ref }}
        - **Commit**: ${{ github.sha }}
        - **Author**: ${{ github.actor }}
        - **Timestamp**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
        EOF

    - name: Upload deployment report
      uses: actions/upload-artifact@v3
      with:
        name: deployment-report
        path: deployment-report.md
