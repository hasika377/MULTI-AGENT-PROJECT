name: Code Quality - Pre-commit Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 isort pylint

    - name: Run Black formatter (check mode)
      run: black --check . --line-length=100

    - name: Run isort (check mode)
      run: isort --check-only .

    - name: Run Flake8
      run: flake8 . --count --show-source --statistics

    - name: Run Pylint
      run: pylint **/*.py --disable=all --enable=E,F || true

    - name: Comment PR with formatting suggestions
      if: failure()
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '❌ Code quality checks failed. Run `make format` to fix formatting issues.'
          })
