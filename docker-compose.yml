version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sdlc-backend
    ports:
      - "8001:8001"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEBUG=${DEBUG:-False}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - .:/app
    command: python ai_developer.py
    networks:
      - sdlc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  gemini-wrapper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gemini-wrapper
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEBUG=${DEBUG:-False}
    command: python main.py
    networks:
      - sdlc-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: sdlc-frontend
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
    command: streamlit run app.py
    networks:
      - sdlc-network
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - .:/app

networks:
  sdlc-network:
    driver: bridge

volumes:
  app-data:
    driver: local
